<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Store & Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding-bottom: 30px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Container */
        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Grid Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        /* Card Menu */
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:active {
            transform: scale(0.95);
            background-color: #334155;
            border-color: #38bdf8;
        }

        .icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.3;
        }

        /* Variasi Warna Icon */
        .bg-orange { background-color: rgba(249, 115, 22, 0.15); color: #f97316; }
        .bg-blue   { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .bg-green  { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .bg-purple { background-color: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .bg-red    { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .bg-teal   { background-color: rgba(20, 184, 166, 0.15); color: #14b8a6; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            white-space: nowrap;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>JB STORE & SERVICES</h1>
        <p>Solusi Kebutuhan Digital & Game Kustomisasi</p>
    </div>

    <div class="container">
        <div class="menu-grid">
            
            <div class="card" onclick="showToast('Membuka Layanan Top Up Game...')">
                <div class="icon-wrapper bg-orange">🎮</div>
                <h3>TOP UP GAME</h3>
            </div>

            <div class="card" onclick="showToast('Membuka Layanan Nomor Kosong...')">
                <div class="icon-wrapper bg-blue">📱</div>
                <h3>NOMOR KOSONG</h3>
            </div>

            <div class="card" onclick="showToast('Membuka Folder File FF...')">
                <div class="icon-wrapper bg-green">📂</div>
                <h3>FILE FF</h3>
            </div>

            <div class="card" onclick="showToast('Membuka Menu Penyewaan Bot...')">
                <div class="icon-wrapper bg-purple">🤖</div>
                <h3>SEWA BOT</h3>
            </div>

            <div class="card" onclick="showToast('Membuka Kumpulan Script Bot...')">
                <div class="icon-wrapper bg-red">💻</div>
                <h3>SCRIPT BOT</h3>
            </div>

            <div class="card" onclick="showToast('Membuka Layanan Desain Logo...')">
                <div class="icon-wrapper bg-teal">🎨</div>
                <h3>DESAIN LOGO</h3>
            </div>

        </div>
    </div>

    <div id="toast" class="toast">Notifikasi</div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
